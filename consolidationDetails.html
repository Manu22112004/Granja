    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <div class="icon icon-logo">
                <img src="icons/logo.png" alt="Farm Icon" style="width:50px; height:50px;">
            </div>
            <span class="system-name">Farm</span>
        </div>
        <div class="header-right">
            <div class="user-profile">
                <div class="user-info">
                    <span class="user-name">John Doe</span>
                    <span class="user-role">Administrator</span>
                </div>
                <div class="icon icon-header">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
            </div>

            <button class="logout-btn">
                <div class="icon icon-button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </div>
                Logout
            </button>
        </div>
    </header>

    <!-- CONTENT -->
    <main class="content">
    <div class="page-header">
        <h1 class="page-title">Consolidated</h1>

        <div class="page-actions-consolidation-production">
            <button
                id="goToReports"
                class="btn-consolidation-report"
            >
                Reports
            </button>
            <button
                id="goToProductionBtn"
                class="btn-consolidation-production"
            >
                Production
            </button>

            <button id="pricingBtn" class="btn-consolidation-production-pricing-modal">
                Pricing
            </button>

            <button id="editConsolidationBtn" class="edit-btn">
                Edit
            </button>
        </div>
    </div>

    <!-- TOP FILTER / CONTEXT KPIs -->
    <section class="dashboard-kpis">

        <div class="kpi-card">
            <span class="kpi-label">Company</span>
            <span class="kpi-value" id="companyName">-</span>
        </div>

        <div class="kpi-card">
            <span class="kpi-label">Customer</span>
            <span class="kpi-value" id="customerName">-</span>
        </div>

        <div class="kpi-card">
            <span class="kpi-label">Crew Leader</span>
            <span class="kpi-value" id="crewLeader">-</span>
        </div>

        <div class="kpi-card">
            <span class="kpi-label">Quality Checker</span>
            <span class="kpi-value" id="qualityChecker">-</span>
        </div>

        <div class="kpi-card">
            <span class="kpi-label">Beds Produced</span>
            <span class="kpi-value" id="bedsProduced">-</span>
        </div>

        <div class="kpi-card">
            <span class="kpi-label">Start</span>
            <span class="kpi-value" id="startDate">-</span>
        </div>

        <div class="kpi-card">
            <span class="kpi-label">Price/hour</span>
            <span class="kpi-value" id="priceHour">-</span>
        </div>

        <div class="kpi-card">
            <span class="kpi-label">Price/Acree</span>
            <span class="kpi-value" id="priceBed">-</span>
        </div>

    </section>

    <!-- MAIN CONSOLIDATION TABLE -->
    <section class="dashboard-card wide" style="margin-top: 24px;">

        <!-- Header -->
        <div style="display:flex; justify-content: space-between; align-items:center;">
            <h3 id="workersTitle">👷 0 Workers Active</h3>

            <button id="addWorkerBtn" class="btn-primary-workers">
                ➕ Add Workers
            </button>
        </div>

        <div class="dashboard-card" style="padding: 0; box-shadow: none; background: transparent;">

            <table style="width:100%; border-collapse: collapse; font-size: 16px;">
                <thead>
                    <tr style="text-align:left; color: var(--malachite-700); font-weight:600;">
                        <th style="padding: 10px 12px; width:80px;">Num</th>
                        <th style="padding: 10px 12px;">Worker</th>
                        <th style="padding: 10px 12px; width:120px; text-align:center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="workersTableBody">
                    <!-- filas dinámicas -->
                </tbody>
            </table>

        </div>
    </section>

    
</main>

<!-- UPDATE CONSOLIDATION MODAL-->
<div id="modalConsolidation" class="modal-consolidation">
    <div class="modal-consolidation-content">
        <span id="closeModalConsolidation" class="close-btn">&times;</span>
        <h2>Edit Consolidation</h2>

        <form id="editForm">

            <label>Work Date</label>
            <input type="date" id="edit_work_date">

            <label>Total Beds Produced</label>
            <input type="number" id="edit_total_beds_produced">

            <label>Company</label>
            <select id="edit_company_id"></select>

            <label>Customer</label>
            <select id="edit_customer_id"></select>

            <label>Crew Leader</label>
            <select id="edit_crew_leader_id"></select>

            <label>Quality Checker</label>
            <select id="edit_quality_checker_id"></select>

            <button type="button" class="save-btn">Save Changes</button>
        </form>
    </div>
</div>

<!-- ADD WORKERS MODAL -->
<div id="addWorkersModal" class="modal-overlay-workers hidden-workers">
    <div class="modal-content-workers">
        <h3>➕ Add Workers</h3>

        <div id="availableWorkersList" class="workers-list-workers">
            <!-- lista dinámica -->
        </div>

        <div class="modal-actions-workers">
            <button id="confirmAddWorkersBtn" class="btn-primary-workers">
                Add Selected
            </button>
            <button id="closeAddWorkersModal" class="btn-danger-workers">
                Cancel
            </button>
        </div>
    </div>
</div>

<!-- PRICING POLICY MODAL -->
<div id="pricingModal" class="modal-consolidation">
    <div class="modal-consolidation-content">
        <span id="closePricingModal" class="close-btn">&times;</span>
        <h2>Pricing Policy</h2>

        <form id="pricingForm">

            <label>Price per Bed</label>
            <input type="number" id="pricing_price_per_bed" min="0" step="0.01">

            <label>Price per Hour</label>
            <input type="number" id="pricing_price_per_hour" min="0" step="0.01">

            <button type="button" id="savePricingBtn" class="save-btn">
                Save Pricing
            </button>
        </form>
    </div>
</div>

<script type="module" src="scripts/sidebar.js"></script>
<script type="module" src="scripts/consolidationDetails.js"></script>
<script type="module" src="scripts/updateConsolidation.js"></script>
<script type="module" src="scripts/pricingPolicyModal.js"></script>

</body>
</html>
